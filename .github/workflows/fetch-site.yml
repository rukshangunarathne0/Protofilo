name: Fetch site source

on:
  push:
    branches:
      - arena/75d3c8a2-protofilo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    # Only run for commits that explicitly ask for a scrape, so the bot's
    # own commit (which does not contain this marker) never re-triggers it.
    if: ${{ contains(github.event.head_commit.message, '[fetch-site]') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scrape site
        env:
          SITE: https://01a1ab49-9a25-770e-8a54-37c3d4e40218.arena.site
        run: python3 scripts/fetch_site.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add fetched site source [no-fetch]"
          git push
